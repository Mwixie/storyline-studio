<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0c12" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Storyline" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=45" />
  <title>Storyline Studio</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="library" aria-label="Open library">
        <span class="brand-mark">S</span>
        <span><strong>Storyline Studio</strong><small>Listen. Notice. Revise.</small></span>
      </button>
      <div class="row"><small style="color:#8f8794">Build 45</small><button id="installBtn" class="ghost tiny hidden">Install</button></div>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-nav="library" class="nav-item active"><span>▥</span><small>Library</small></button>
      <button data-nav="reader" class="nav-item"><span>◫</span><small>Read</small></button>
      <button data-nav="queue" class="nav-item"><span>☷</span><small>Queue</small><b id="queueBadge" class="badge hidden">0</b></button>
      <button data-nav="actioned" class="nav-item"><span>✓</span><small>Actioned</small></button>
      <button id="readerToolsToggle" class="nav-item mobile-tools-toggle" type="button"><span>＋</span><small>Tools</small></button>

      <div id="readerNavTools" class="reader-nav-tools hidden" aria-label="Reader tools">
        <div class="reader-tools-label">Manuscript tools</div>
        <button class="nav-tool" data-reader-act="note"><span>✎</span><small>Add note</small></button>
        <button class="nav-tool" data-reader-act="voice"><span>●</span><small>Voice note</small></button>
        <button class="nav-tool" data-reader-act="continuity"><span>⚑</span><small>Continuity</small></button>
        <button class="nav-tool" data-reader-act="bookmark"><span>⌑</span><small>Bookmark</small></button>
        <button class="nav-tool" data-reader-act="pronunciations"><span>Aa</span><small>Pronunciations</small></button>
        <button class="nav-tool" data-reader-act="handoff"><span>⌁</span><small>Handoff</small></button>
        <button class="nav-tool nav-tool-primary" data-reader-act="start"><span>▶</span><small>Start here</small></button>
      </div>

      <button id="navCollapse" class="nav-item nav-collapse" type="button" aria-label="Collapse navigation" aria-expanded="true"><span>‹</span><small>Collapse</small></button>
    </nav>
  </div>

  <input id="fileInput" type="file" accept=".docx,.epub,.pdf,.odt,.txt,.md,.markdown,.html,.htm,text/plain,text/markdown,text/html,application/pdf,application/epub+zip,application/vnd.oasis.opendocument.text,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden />

  <dialog id="modal" class="modal"><form method="dialog" id="modalForm" class="modal-card"></form></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="./vendor/qrcode.min.js"></script>
  <script src="./vendor/jsQR.js"></script>
  <script>
    if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <script src="app.js?v=45"></script>
</body>
</html>
